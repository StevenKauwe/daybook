<script>
try {
  const key='daybook-transcript-shortlist';
  window.openai={widgetState:JSON.parse(localStorage.getItem(key)||'null'),setWidgetState:async (value)=>{localStorage.setItem(key,JSON.stringify(value))}};

<body><main>
<nav class="study-nav" aria-label="Transcript views">
  <h1>Transcript studies</h1>
  <button id="prev" type="button" aria-label="Previous view">‹</button>
  <select id="study" aria-label="Choose a view"></select>
  <button id="next" type="button" aria-label="Next view">›</button>

</nav>
<div id="daybook-transcript-lab">
  <div class="viz-carousel" aria-label="Daybook transcript designs">
    <section data-variant="Parallel transcript">
<section id="daybook-columns" aria-label="Daybook parallel transcript">
  <header class="pt-title">
    <div><span class="pt-brand">Daybook</span><h2>Parallel transcript</h2></div>

  </header>
  <section class="pt-range" aria-label="Time window">
    <div class="pt-tools">
      <div class="pt-fields"><label>From <input data-from type="text" value="10:14:00" aria-label="Range start"></label><span aria-hidden="true">→</span><label>Until <input data-until type="text" value="10:15:00" aria-label="Range end"></label></div>
      <div class="pt-zooms" role="group" aria-label="Time shown"><button type="button" data-zoom="out" aria-label="Zoom out">−</button><button type="button" data-seconds="30" aria-pressed="false">30 sec</button><button type="button" data-seconds="60" aria-pressed="true">1 min</button><button type="button" data-seconds="300" aria-pressed="false">5 min</button><button type="button" data-seconds="600" aria-pressed="false">10 min</button><button type="button" data-zoom="in" aria-label="Zoom in">+</button></div>
    </div>
    <div class="pt-ruler">
      <div class="pt-bands" aria-hidden="true"></div>
      <div class="pt-window" aria-hidden="true"></div>
      <input class="pt-handle" data-grip="from" aria-label="Start of selected range" type="range" min="0" max="600" step="1" value="0">
      <input class="pt-handle" data-grip="until" aria-label="End of selected range" type="range" min="0" max="600" step="1" value="60">
    </div>
    <div class="pt-ticks" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <output class="pt-extent" aria-live="polite"></output>
    <p class="pt-message" role="alert" hidden></p>
  </section>
  <div class="pt-scroll" role="region" aria-label="Transcript by source"><div class="pt-grid"></div><div class="pt-empty" hidden></div></div>
  <p class="pt-audio-note" hidden></p>
  <section id="pt-fold-detail" class="pt-detail" aria-labelledby="pt-detail-title" hidden>
    <header class="pt-detail-head"><h3 id="pt-detail-title"></h3><div class="pt-actions"><button type="button" data-zoom-fold>Zoom here</button><button type="button" data-close-fold>Close</button></div></header>
    <div class="pt-detail-entries"></div>
  </section>
  <footer class="pt-footer">
    <div class="pt-actions">
      <button class="pt-primary" type="button" data-copy="all">Copy conversation</button>

<style>

<script>
function mountParallelTranscript(root, sample, pictures, remember = false) {
  const find = selector => root.querySelector(selector);
  const lanes = { mic: 'Microphone', sys: 'System audio', save: 'Screen & clipboard' };
  const duration = 600;
  const origin = (10 * 60 + 14) * 60;
  const maxOffset = Number.MAX_SAFE_INTEGER - origin;
  const compactNumber = new Intl.NumberFormat('en', {notation:'compact', maximumFractionDigits:1});
  function stamp(offset) {
    const seconds = origin + offset;
    const days = Math.floor(seconds / 86400);
    const clock = [Math.floor(seconds / 3600) % 24, Math.floor(seconds / 60) % 60, seconds % 60]
      .map(n => String(n).padStart(2, '0')).join(':');
    return (days ? '+' + days + 'd ' : '') + clock;
  }
  function tickLabel(t, span) {
    const days = Math.floor((origin + t) / 86400), full = stamp(t);
    if (!days) return full;
    const day = '+' + compactNumber.format(days) + 'd';
    return span >= 3*86400 ? day : day + ' ' + full.split(' ')[1];
  }
  const picks = new Map();
  let start = 0, until = 60, visible = [], layoutFrame = 0, previewScope = 'auto';
  let horizon = duration, heldHorizon = 0;
  const scroll = find('.pt-scroll'), grid = find('.pt-grid'), ruler = find('.pt-ruler');
  const preview = find('.pt-copy-preview'), area = preview.querySelector('textarea');
  const detail = find('.pt-detail'), detailEntries = find('.pt-detail-entries');
  const folds = new Map();
  let openFold = null;
  const original = find('.pt-original');
  let originButton = null, pinned = false, hideTimer = 0;

  function element(tag, css, text) {
    const el = document.createElement(tag);
    if (css) el.className = css;
    if (text !== undefined) el.textContent = text;
    return el;
  }
  function button(css, text, name) {
    const el = element('button', css, text);
    el.type = 'button';
    if (name) el.setAttribute('aria-label', name);
    return el;
  }
  // Fictional continuation of the same print review used by the one-minute studies.
  const cover = sample.find(e => e.id === 'cover');
  const later = [
    {id:'room', at:76, end:83, lane:'mic', text:'Can we give the title a little more room at the top?'},
    {id:'margin', at:85, end:94, lane:'sys', text:'Yes. Take it from the bottom margin.'},
    {id:'margin-note', at:91, end:91, lane:'save', name:'Pasted text', text:'Move the title up by 4 mm.'},
    {id:'warmth', at:145, end:155, lane:'sys', text:'The paper looks warmer in this light.'},
    {id:'daylight', at:150, end:158, lane:'mic', text:'I’ll put the proof next to the window.'},
    {id:'binding', at:175, end:181, lane:'mic', text:'And the binding?'},
    {id:'thread', at:181, end:188, lane:'sys', text:'Green thread. Same as the first edition.'},
    {id:'thread-ok', at:189, end:193, lane:'mic', text:'Good. Keep the green.'},
    {id:'thread-note', at:190, end:190, lane:'save', name:'Pasted text', text:'Binding · forest green thread'},
    {id:'final-cover', at:312, end:322, lane:'mic', text:'Here’s the cover with the extra space.'},
    {id:'final-look', at:312, end:318, lane:'sys', text:'That reads better already.'},
    {id:'read-title', at:325, end:331, lane:'sys', text:'The title has room to breathe.'},
    {id:'second-proof', at:329, end:329, lane:'save', name:'Pasted image', text:'Print proof due Friday', asset:'card'},
    {id:'quantity', at:431, end:444, lane:'sys', text:'Can the printer hold two hundred copies for us?'},
    {id:'quantity-ok', at:438, end:448, lane:'mic', text:'Yes. I’ll confirm the quantity this afternoon.'},

      const lane = element('section','pt-lane'), head=element('div','pt-head'), body=element('div','pt-track');
      lane.dataset.lane=key;lane.setAttribute('aria-label',lanes[key]);
      const select = button('pt-lane-select',lanes[key],'Select column '+lanes[key]);
      const title = element('h3');
      title.append(select);
      const copy = button('pt-lane-copy','Copy','Copy column '+lanes[key]);
      const local=visible.filter(e=>e.lane===key);
      select.addEventListener('click',()=>{
        const clear = local.every(fullyPicked);
        for (const e of local) {
          if (clear) picks.delete(e.id);
          else picks.set(e.id,full(e));
        }
        updatePicks();
      });
      copy.addEventListener('click',()=>copyToClipboard(key));
      head.append(title,copy);lane.append(head,body);grid.append(lane);
      const bundles = new Map();
      for(const e of local) {
        const at=clippedStart(e);
        if(!bundles.has(at)) {
          const bundle=element('div','pt-bundle');bundle.dataset.at=at;
          bundles.set(at,bundle);body.append(bundle);
        }
        bundles.get(at).append(makeEntry(e));
      }
    }
    updatePicks();
    measure();
  }
  let observedWidth = 0;
  new ResizeObserver(([change])=>{
    if (observedWidth !== change.contentRect.width) {
      observedWidth=change.contentRect.width;queueMeasure();if (!original.hidden)placeOriginal();
    }
  }).observe(scroll);
  document.fonts?.ready.then(queueMeasure);

  function setBounds(from,to) {
    from = Math.max(0, Math.min(maxOffset - 1, Math.round(from)));
    to = Math.max(from + 1, Math.min(maxOffset, Math.round(to)));
    const changed = start!==from || until!==to;
    start=from;until=to;
    if (changed) previewScope = 'auto';
    const extent = Math.max(duration, until, heldHorizon);
    if (horizon !== extent || !find('.pt-bands').childElementCount) {
      horizon = extent;
      drawOverview();
    }
    for(const [key,val] of [['from',start],['until',until]]) {
      const field = find('[data-'+key+']');
      field.value = stamp(val);
      field.style.width = Math.max(79, Math.min(165, field.value.length * 8 + 12)) + 'px';
      field.removeAttribute('aria-invalid');
      const grip=find('[data-grip='+key+']');
      grip.max=String(horizon);grip.value=String(val);grip.setAttribute('aria-valuetext',stamp(val));
    }
    for (const preset of root.querySelectorAll('[data-seconds]')) {
      preset.setAttribute('aria-pressed', String(until - start === Number(preset.dataset.seconds)));
    }
    find('[data-zoom=in]').disabled = until - start === 1;
    find('[data-zoom=out]').disabled = until - start === maxOffset;
    const outside = find('.pt-extent');
    const endNotice = until > duration ? 'Sample recording ends at ' + stamp(duration) + '.' : '';
    if (outside.textContent !== endNotice) outside.textContent = endNotice;
    const windowMark=find('.pt-window');
    windowMark.style.left=(start/horizon*100)+'%';windowMark.style.width=((until-start)/horizon*100)+'%';
    find('.pt-message').hidden=true;
    if(changed || !grid.childElementCount) { scroll.scrollTop=0;drawGrid(); }
  }
  for (const key of ['from','until']) {
    const grip=find('[data-grip='+key+']'), input=find('[data-'+key+']');
    grip.addEventListener('input',()=>{
      const t=Number(grip.value);
      if(key==='from')setBounds(Math.min(t,until-1),until);
      else setBounds(start,Math.max(t,start+1));
    });
    function commitInput() {
      const raw=input.value.trim();
      const m = /^(?:\+?(\d+)d\s+)?([01]?\d|2[0-3]):([0-5]\d):([0-5]\d)$/.exec(raw);
      const t = m ? Number(m[1] || 0)*86400 + Number(m[2])*3600 + Number(m[3])*60 + Number(m[4]) - origin :
        (/^\d+$/.test(raw) ? Number(raw) : NaN);
      if (!Number.isSafeInteger(t) || t < (key==='from'?0:1) || t > (key==='from'?maxOffset-1:maxOffset)) {
        const msg=find('.pt-message');msg.hidden=false;msg.textContent='Enter a clock time from 10:14:00 onward, or seconds from the start.';
        input.setAttribute('aria-invalid','true');return;
      }
      input.removeAttribute('aria-invalid');
      if(key==='from')setBounds(t,Math.max(until,t+1));else setBounds(Math.min(start,t-1),t);
    }
    input.addEventListener('change',commitInput);
    input.addEventListener('keydown',e=>{if(e.key==='Enter') {e.preventDefault();commitInput();}});
  }
  let drag = null;
  const secondAt = x => {const b = ruler.getBoundingClientRect();return Math.max(0,Math.min(horizon,Math.round((x-b.left)/b.width*horizon)));};
  function dragTo(t) {
    const a=Math.min(drag.at,t,horizon-1), b=Math.max(drag.at,t,a+1);
    setBounds(a,b);
  }
  ruler.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    heldHorizon=horizon;
    if(e.target.matches('input'))return;
    e.preventDefault();drag={at:secondAt(e.clientX),id:e.pointerId};ruler.setPointerCapture(e.pointerId);
  });
  ruler.addEventListener('pointermove',e=>{if(drag?.id===e.pointerId)dragTo(secondAt(e.clientX));});
  ruler.addEventListener('pointerup',e=>{if(drag?.id===e.pointerId){dragTo(secondAt(e.clientX));drag=null;}});
  function releaseOverview() {
    drag=null;heldHorizon=0;setBounds(start,until);
  }
  ruler.addEventListener('lostpointercapture',releaseOverview);
  document.addEventListener('pointerup',()=>{if(heldHorizon)releaseOverview();});
  document.addEventListener('pointercancel',()=>{if(heldHorizon)releaseOverview();});
  for (const preset of root.querySelectorAll('[data-seconds]')) {
    preset.addEventListener('click', () => {
      const span = Number(preset.dataset.seconds);
      const left = Math.min(start, Math.max(0, duration - span));
      setBounds(left, left + span);
    });
  }
  function zoom(factor, anchor = start === 0 ? 0 : .5) {
    const span = until - start;
    const next = Math.max(1, Math.min(maxOffset, Math.round(span * factor)));
    const left = Math.max(0, Math.min(maxOffset - next, Math.round(start + anchor * (span - next))));
    setBounds(left, left + next);
  }
  find('[data-zoom=out]').addEventListener('click', () => zoom(2));
  find('[data-zoom=in]').addEventListener('click', () => zoom(.5));
  let wheelRemainder = 0, lastWheelAt = 0;
  scroll.addEventListener('wheel', event => {
    if (!event.ctrlKey && !event.metaKey) return;
    event.preventDefault();
    const track = grid.querySelector('.pt-track')?.getBoundingClientRect();
    const anchor = track ? Math.max(0, Math.min(1, (event.clientY - track.top - 10) / (track.height - 40))) : .5;
    const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? 400 : 1);
    if (event.timeStamp - lastWheelAt > 250 || Math.sign(delta) !== Math.sign(wheelRemainder)) wheelRemainder = 0;
    lastWheelAt = event.timeStamp;
    wheelRemainder += delta;
    const previousSpan = until - start;
    zoom(2 ** Math.max(-3, Math.min(3, wheelRemainder / 160)), anchor);
    if (until - start !== previousSpan) wheelRemainder = 0;
  }, {passive:false});

  // A browser has one live selection. Save character offsets per passage so
  // someone can select words here, then select different words in a second column.
  function selectedWords() {
    const selection=window.getSelection();
    if (!selection?.rangeCount || selection.isCollapsed) return [];
    const range=selection.getRangeAt(0);
    const parent = n => (n.nodeType===1 ? n : n.parentElement)?.closest('.pt-lane,.pt-detail-entries');
    const lane=parent(range.startContainer);
    if(!lane || !root.contains(lane) || parent(range.endContainer)!==lane) return [];
    const pieces=[];
    for(const article of lane.querySelectorAll('[data-entry]')) {
      const node=article.querySelector('.pt-text').firstChild;
      if(!range.intersectsNode(node))continue;
      const lo=range.startContainer===node ? range.startOffset : 0;
      const hi=range.endContainer===node ? range.endOffset : node.length;
      if(node.textContent.slice(lo,hi).trim())pieces.push({id:article.dataset.entry,lo,hi});
    }
    return pieces;
  }
  function keepWords() {
    const pieces=selectedWords();
    if(!pieces.length)return;
    for(const p of pieces)picks.set(p.id,[p.lo,p.hi]);
    updatePicks();
  }
  let selecting=false;
  root.addEventListener('pointerdown',e=>{selecting=!!e.target.closest('.pt-text,.pt-body')&&!e.target.closest('button');});
  document.addEventListener('pointerup',()=>{if(selecting){selecting=false;requestAnimationFrame(keepWords);}});
  document.addEventListener('pointercancel',()=>{selecting=false;});
  root.addEventListener('keyup',e=>{if(e.shiftKey || e.key==='Shift')keepWords();});
  find('[data-clear]').addEventListener('click',()=>{
    const selection=window.getSelection();if(selection?.anchorNode && root.contains(selection.anchorNode))selection.removeAllRanges();
    picks.clear();laneAnchors={};previewScope='auto';updatePicks();
  });
  root.addEventListener('copy',e=>{
    if(!e.clipboardData || e.target===area || original.contains(e.target))return;
    const pieces=selectedWords();
    let text;
    if(pieces.length) text=pieces.map(p=>entries.find(x=>x.id===p.id).text.slice(p.lo,p.hi)).join('\n');
    else if(!window.getSelection()?.isCollapsed || !lastSelected().length || e.target.closest('input,textarea'))return;
    else text=copyRows('picks').join('\n');
    e.clipboardData.setData('text/plain',text);e.preventDefault();
  });
  function openPreview() {
    preview.hidden=false;
    find('[data-preview-toggle]').setAttribute('aria-expanded','true');
    showPreview();
  }
  async function copyToClipboard(scope) {
    const lines=copyRows(scope), text=lines.join('\n');
    if(!lines.length)return;
    previewScope=scope;
    if(!preview.hidden)showPreview();
    let success=false;
    try {await navigator.clipboard.writeText(text);success=true;} catch {}
    if(!success) {
      openPreview();area.focus();area.select();
      try {success=document.execCommand('copy');} catch {}
    }
    find('.pt-receipt').textContent=success ? 'Copied '+lines.length+(lines.length===1?' entry.':' entries.')
      : 'The text is selected below. Press ⌘C or use the selection’s Copy action.';
  }
  find('[data-copy=all]').addEventListener('click',()=>copyToClipboard('all'));
  find('[data-copy=picks]').addEventListener('click',()=>copyToClipboard('picks'));
  find('[data-preview-toggle]').addEventListener('click',()=>{
    if(preview.hidden){previewScope='auto';openPreview();}
    else {preview.hidden=true;find('[data-preview-toggle]').setAttribute('aria-expanded','false');}
  });
  setBounds(start,until);
  if (remember && window.openai) {
    let saved, timer;
    const snapshot = () => ({sample:sampleName, from:start, until, excerpts:[...picks]});
    function restore(state) {
      const view = state?.privateContent?.parallelTranscript;
      if (!view || !Number.isSafeInteger(view.from) || !Number.isSafeInteger(view.until) ||
          view.from < 0 || view.until > maxOffset || view.from >= view.until) return;
      // Restore excerpts from the original sample when reopening an older study.
      chooseSample(view.sample ?? (view.excerpts?.length ? 'pauses' : 'steady'));
      picks.clear();
      for (const item of Array.isArray(view.excerpts) ? view.excerpts : []) {
        if (!Array.isArray(item) || !Array.isArray(item[1])) continue;
        const entry = byId.get(item[0]), [lo,hi] = item[1];
        if (entry && Number.isInteger(lo) && Number.isInteger(hi) && lo >= 0 && hi <= entry.text.length && lo < hi) {
          picks.set(entry.id,[lo,hi]);
        }
      }
      setBounds(view.from,view.until);
      updatePicks();
      saved = JSON.stringify(snapshot());
    }
    restore(window.openai.widgetState);
    saved = JSON.stringify(snapshot());
    window.addEventListener('openai:set_globals', event => restore(event.detail?.globals?.widgetState));
    function rememberInteraction() {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const state = snapshot(), key = JSON.stringify(state);
        if (key === saved) return;
        saved = key;
        window.openai?.setWidgetState?.({modelContent:{sample:find('[data-sample]').selectedOptions[0].textContent, timeWindow:[stamp(start),stamp(until)]},
          privateContent:{parallelTranscript:state}})?.catch(() => {});
      },180);
    }
    for (const event of ['click','change','pointerup','keyup','wheel']) root.addEventListener(event,rememberInteraction);
  }
}

  #daybook-transcript-lab .index nav {display:flex;flex-wrap:wrap}
  #daybook-transcript-lab .db-entry.bubble {max-width:92%}
}
@media(pointer:coarse) {
  #daybook-transcript-lab .db-window button {min-height:42px}
  #daybook-transcript-lab .track {height:46px}
}
#daybook-transcript-lab .db-window {height:615px}
#daybook-transcript-lab .db-scene {min-height:0;overflow:auto;scrollbar-gutter:stable}
@container(max-width:560px) {#daybook-transcript-lab .db-window {height:700px}}
</style>
<script>
(() => {
  const root = document.getElementById('daybook-transcript-lab');
  const events = [
    {id:'press', at:0, end:11, lane:'sys', text:'The preview still has the old cover. Can you pull up the new one?'},
    {id:'look', at:4, end:13, lane:'mic', text:'Here it is. The new title fits on one line.'},
    {id:'cover', at:6, end:6, lane:'save', name:'Screenshot', text:'Field Notes · Autumn edition', asset:'cover'},
    {id:'proof', at:19, end:30, lane:'mic', text:'I’ll send the cover to print on Friday.'},
    {id:'stock', at:21, end:31, lane:'sys', text:'Sounds good. Use the uncoated stock.'},
    {id:'card', at:22, end:22, lane:'save', name:'Pasted image', text:'Print proof due Friday', asset:'card'},
    {id:'clip', at:25, end:25, lane:'save', name:'Pasted text', text:'Stock: uncoated, warm white.'}
  ];
  const labels = {sys:'System audio',mic:'Microphone',save:'Screen & clipboard'};
  const beats = [
    {at:0, end:13, title:'Checking the cover'},
    {at:19, end:31, title:'Sending the proof'},
    {at:32, end:60, title:'After the conversation'}
  ];
  const sections = [...root.querySelectorAll('[data-variant]')];
  const shortlist = new Set();
  const prettyTime = (s) => '10:' + (s >= 60 ? '15':'14') + ':' + String(s%60).padStart(2,'0');
  const shortTime = (s) => '+' + s + 's';
  const get = (id) => events.find(e => e.id === id);
  const phase = (t) => {
    if (t >= 60) return 'Recording stopped';
    if (t >= 56) return 'Waiting for audio · last samples at 10:14:55';
    const speech = events.filter(e => e.lane !== 'save' && e.at <= t);
    if (speech.some(e => e.end >= t)) return 'Listening · speech coming in';
    const last = Math.max(0, ...speech.map(e => e.end));
    return 'Listening · ' + (t-last) + 's since the last words · ' + (t >= 36 && t < 48 ? 'sound on system audio' : 'quiet inputs');
  };
  function poster(which) {
    const canvas = document.createElement('canvas');
    canvas.width=640; canvas.height=380;
    const g=canvas.getContext('2d');
    if (which==='cover') {
      g.fillStyle='#f1ead7';g.fillRect(0,0,640,380);
      g.fillStyle='#294a3d';g.fillRect(402,0,238,380);
      g.strokeStyle='#9daf84';g.lineWidth=2;
      for(let i=0;i<17;i++) {
        g.beginPath(); for(let x=402;x<=640;x+=2) {
          const y=66+i*15+Math.sin(x/37+i*.16)*21+Math.cos(x/25)*8;
          if(x===402)g.moveTo(x,y);else g.lineTo(x,y);
        } g.stroke();
      }
      g.fillStyle='#26392b';g.font='18px system-ui';g.fillText('PRINT STUDIO  /  COVER PROOF',32,45);
      g.font='64px Georgia';g.fillText('Field Notes',28,174);g.font='italic 32px Georgia';g.fillText('Autumn edition',31,220);
      g.strokeStyle='#9a9b87';g.beginPath();g.moveTo(32,297);g.lineTo(366,297);g.stroke();
      g.font='17px system-ui';g.fillText('A5  /  UNCOATED',32,336);
    } else {
      g.fillStyle='#f3cd87';g.fillRect(0,0,640,380);g.fillStyle='#273b36';g.fillRect(0,0,640,56);
      g.fillStyle='#ffefd0';g.font='20px system-ui';g.fillText('PRINT ROOM     /     PRODUCTION SLIP',27,36);
      g.fillStyle='#533c22';g.font='24px system-ui';g.fillText('PRINT PROOF',30,127);
      g.font='bold 86px Georgia';g.fillText('Due Friday',25,234);
      g.lineWidth=2;g.strokeStyle='#755733';g.strokeRect(29,287,29,28);g.font='22px system-ui';g.fillText('Approve before sending to press',77,311);
    }
    return canvas.toDataURL('image/png');
  }
  const pictures={cover:poster('cover'),card:poster('card')};
  const esc = (s) => String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  function attachment(e) {
    const icon=e.asset ? '<img alt="" src="'+pictures[e.asset]+'">' : '<span class="db-glyph" aria-hidden="true">▤</span>';
    return '<button class="attachment" type="button" data-original="'+e.id+'" aria-label="Open original '+e.name.toLowerCase()+' at '+prettyTime(e.at)+'">'+icon+'</button>';
  }
  function entry(e,extra) {
    return '<div class="db-entry '+e.lane+' '+(extra||'')+'" data-entry="'+e.id+'"><div class="db-by">'+
      esc(e.name||labels[e.lane])+' <span class="db-time">'+prettyTime(e.at)+(e.end>e.at?' · '+(e.end-e.at)+'s':'')+'</span></div><p>'+esc(e.text)+
      (e.lane==='save'?attachment(e):'')+'</p></div>';
  }
  const list = (ev, extra) => ev.map(e=>entry(e,extra)).join('');
  const capture = (e) => e.lane==='save';
  const words = (e) => !capture(e);
  function beatEvents(b, t) { return events.filter(e => e.at>=b.at && e.at<=b.end && e.at<=t); }
  function near(e, at) { return capture(e) ? e.at===at : e.at<=at && e.end>=at; }
  const small = (s) => '<span class="micro">'+esc(s)+'</span>';
  const timeTag = (s) => '<span class="db-time">'+prettyTime(s)+'</span>';
  function voiceAndCaptures(ev) {
    return '<div class="cols"><div class="column"><h3>Conversation</h3>'+list(ev.filter(words))+'</div><div class="column"><h3>Screen & clipboard</h3>'+
      (list(ev.filter(capture))||small('No captures in this moment'))+'</div></div>';
  }
  function renderScene(name, s) {
    const ev=events.filter(e=>e.at<=s.time);
    const available=beats.filter(b=>b.at<=s.time);
    if (name==='Margin notes') return available.map(b=>{
      const items=beatEvents(b,s.time);
      if(!items.length)return '';
      return '<div class="db-row margin-row"><span class="db-time">'+shortTime(b.at)+'</span><div>'+list(items.filter(words))+'</div><aside class="margin-captures">'+list(items.filter(capture))+'</aside></div>';
    }).join('');
    if(name==='Track mixer') {
      const selected=ev.find(e=>e.id===s.selected)||ev[0];
      const tracks=['mic','sys','save'].map(lane=>'<div class="rail"><b class="db-label">'+labels[lane]+'</b><div class="track '+lane+'">'+
        ev.filter(e=>e.lane===lane).map(e=>'<button type="button" data-select="'+e.id+'" aria-pressed="'+(selected.id===e.id)+'" aria-label="'+esc((e.name||labels[lane])+' at '+prettyTime(e.at))+'" style="left:'+e.at/60*100+'%;width:'+Math.max(3,(Math.min(e.end,s.time)-e.at)/60*100)+'%">'+(capture(e)?'•':'')+'</button>').join('')+'</div></div>').join('');
      return '<div class="track-ticks micro"><span>0s</span><span>15s</span><span>30s</span><span>45s</span><span>60s</span></div>'+tracks+
        '<div class="navline">'+ev.filter(capture).map(e=>'<button type="button" class="compact-action" data-select="'+e.id+'">'+esc(e.name)+'</button>').join('')+'</div><div class="readout">'+entry(selected)+small('At the same time')+list(ev.filter(e=>e.id!==selected.id && (capture(selected)?near(e,selected.at):e.at>=selected.at&&e.at<=selected.end)))+'</div>';
    }
    if(name==='Moment cards') return available.map((b,i)=>{
      const items=beatEvents(b,s.time);
      return '<details class="mom" data-moment="'+i+'" '+(s.open.has(i)?'open':'')+'><summary>'+esc(b.title)+' <small>'+prettyTime(b.at)+'</small></summary>'+
        (items.length?voiceAndCaptures(items):small(phase(s.time)))+'</details>';
    }).join('');
    if(name==='Split desk') {
      const selected=ev.find(e=>e.id===s.selected&&capture(e));
      return '<div class="cols"><section class="column"><h3>Conversation</h3>'+ev.filter(words).map(e=>entry(e,selected&&near(e,selected.at)?'linked':'')).join('')+'</section><section class="column"><h3>Capture desk</h3>'+
        ev.filter(capture).map(e=>entry(e)+'<button type="button" class="compact-action" data-select="'+e.id+'" aria-pressed="'+(e===selected)+'">Highlight words at '+prettyTime(e.at)+'</button>').join('')+'</section></div>';
    }
    if(name==='Conversation')return available.map(b=>{
      const items=beatEvents(b,s.time);
      return items.length?'<div class="chat-beat">'+timeTag(b.at)+items.map(e=>capture(e)?'<aside class="chat-context">'+entry(e)+'</aside>':entry(e,'bubble')).join('')+'</div>':'';
    }).join('');
    if(name==='Contact sheet') {
      const cards=ev.filter(capture);
      return '<div class="gallery">'+cards.map(e=>'<article class="tile"><button class="thumb" type="button" data-original="'+e.id+'" aria-label="Open original '+e.name.toLowerCase()+'">'+
        (e.asset?'<img alt="" src="'+pictures[e.asset]+'">':'<span class="paste-paper">“Uncoated, warm white.”</span>')+'</button>'+entry(e)+
        '<button class="compact-action" type="button" data-select="'+e.id+'" aria-pressed="'+(s.selected===e.id)+'">Read conversation</button></article>').join('')+'</div><div class="readout">'+
        small(s.selected&&cards.some(e=>e.id===s.selected)?'Spoken at '+prettyTime(get(s.selected).at):'Conversation')+
        list(ev.filter(words).filter(e=>!cards.some(c=>c.id===s.selected)||near(e,get(s.selected).at)))+'</div>';
    }
    if(name==='Time lens') {
      const items=ev.filter(e=>near(e,s.time));
      return '<div class="navline"><button type="button" data-jump="6">Cover appears</button><button type="button" data-jump="22">Voices overlap</button><button type="button" data-jump="45">Music only</button><button type="button" data-jump="51">Quiet</button></div>'+
        '<div class="readout"><div class="db-time">At '+prettyTime(s.time)+'</div>'+
        (items.length?voiceAndCaptures(items):'<p>'+esc(phase(s.time))+'</p>')+'</div>';
    }
    if(name==='Reading copy') return '<div class="reading">'+available.map(b=>{
      const items=beatEvents(b,s.time); if(!items.length)return '';
      return '<div class="mom">'+timeTag(b.at)+list(items.filter(words))+
        (items.some(capture)?'<aside>'+list(items.filter(capture))+'</aside>':'')+'</div>';
    }).join('')+'</div>';
    if(name==='Moment index') {
      const i=Math.min(s.beat,available.length-1);
      const b=available[i];const items=beatEvents(b,s.time);
      return '<div class="index"><nav aria-label="Moments">'+available.map((moment,j)=>'<button type="button" data-beat="'+j+'" aria-pressed="'+(i===j)+'"><small class="db-time">'+prettyTime(moment.at)+'</small><br>'+esc(moment.title)+'</button>').join('')+'</nav>'+
        '<div class="column"><h3>'+esc(b.title)+'</h3>'+(items.length?list(items):small(phase(s.time)))+'</div></div>';
    }
    return '<div class="stack">'+['mic','sys','save'].map(lane=>{
      const items=ev.filter(e=>e.lane===lane);
      const expanded=s.stack.has(lane);
      return '<section><h3>'+labels[lane]+'</h3>'+(items.length?list(expanded?items:items.slice(-1)):small('Nothing yet'))+
        (items.length>1?'<button class="compact-action" type="button" data-stack="'+lane+'" aria-pressed="'+expanded+'">'+(expanded?'Show latest':'Show all '+items.length)+'</button>':'')+'</section>';
    }).join('')+'</div>';
  }

  function savePicks() {
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{daybookViews:[...shortlist]}}).catch(()=>{});
    updatePicks();
  }
  function updatePicks() {
    for(const btn of root.querySelectorAll('[data-pick]')) {
      const picked=shortlist.has(btn.closest('[data-variant]').dataset.variant);
      btn.textContent=picked?'★ Shortlisted':'☆ Shortlist'; btn.setAttribute('aria-pressed',String(picked));
    }
  }
  function restorePicks(state) {
    const picks=state?.modelContent?.daybookViews;
    if(Array.isArray(picks)){shortlist.clear();for(const name of picks) if(sections.some(s=>s.dataset.variant===name))shortlist.add(name);updatePicks();}
  }
  root.addEventListener('click', e => {
    const pick = e.target.closest('[data-pick]');
    if (!pick) return;
    const name = pick.closest('[data-variant]').dataset.variant;
    if (shortlist.has(name)) shortlist.delete(name); else shortlist.add(name);
    savePicks();
  });
  for (const section of sections) {
    const name=section.dataset.variant;
    if (name === 'Parallel transcript') {
      const view = section.querySelector('#daybook-columns');
      view.querySelector('[data-pick]').hidden = false;
      mountParallelTranscript(view, events, pictures);
      continue;
    }
    const s={time:name==='Time lens'?22:51,selected:name==='Track mixer'||name==='Split desk'?'cover':null,beat:0,open:new Set([0,1]),stack:new Set(),interval:null};
    section.setAttribute('aria-label',name+' transcript');
    section.innerHTML='<div class="db-window"><header class="db-bar"><span class="brand">Daybook</span><small>Sample recording · 10:14–10:15</small></header>'+
      '<div class="db-heading"><h2>'+esc(name)+'</h2><button type="button" class="compact-action" data-pick aria-pressed="false">☆ Shortlist</button></div>'+
      '<div class="db-scene"></div><div class="db-listening"><span class="db-light"></span><span class="status-line"></span></div>'+
      '<footer class="db-foot"><button type="button" data-play>Play sample</button><label><span class="db-label">Time</span><input type="range" min="0" max="60" value="51" aria-label="Sample time"></label><output class="db-time">10:14:51</output></footer>'+
      '<section class="db-original" role="dialog" aria-label="Original capture" hidden></section></div>';
    const scene=section.querySelector('.db-scene'), original=section.querySelector('.db-original');
    const slider=section.querySelector('input'), play=section.querySelector('[data-play]');
    let originButton, sceneVersion='';
    function redraw(force=false) {
      const signature=events.filter(e=>e.at<=s.time).length+':'+beats.filter(b=>b.at<=s.time).length;
      if(force||signature!==sceneVersion||name==='Time lens'||name==='Track mixer'||name==='Moment index'&&s.beat===2||name==='Moment cards'&&s.open.has(2)) {
        sceneVersion=signature; scene.innerHTML=renderScene(name,s);
      }
      slider.value=s.time; slider.setAttribute('aria-valuetext',prettyTime(s.time));
      section.querySelector('output').textContent=prettyTime(s.time);
      section.querySelector('.status-line').textContent=phase(s.time);
      section.querySelector('.db-light').classList.toggle('off',s.time>=56);
    }
    function stop(){if(s.interval!==null)clearInterval(s.interval);s.interval=null;play.textContent=s.time===60?'Replay sample':'Play sample';}
    function move(t){s.time=Math.max(0,Math.min(60,t));redraw();if(s.time===60)stop();}
    function closeOriginal(){original.hidden=true;original.replaceChildren();setBackground(false);if(originButton?.isConnected)originButton.focus();}
    function setBackground(inert) {
      for(const el of section.querySelector('.db-window').children) if(el!==original)el.inert=inert;
    }
    function showOriginal(e,button) {
      stop();originButton=button;
      original.innerHTML='<div class="original-head"><h3>'+esc(e.name)+'</h3><button type="button" data-close>Back to transcript</button></div><small>'+prettyTime(e.at)+'</small>'+
        (e.asset?'<img src="'+pictures[e.asset]+'" alt="'+esc(e.text)+'"><details><summary>Text from image</summary><p>'+esc(e.text)+'</p></details>':'<blockquote>'+esc(e.text)+'</blockquote>');
      original.hidden=false;setBackground(true);original.querySelector('button').focus();
    }
    section.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.hasAttribute('data-original'))showOriginal(get(b.dataset.original),b);
      else if(b.hasAttribute('data-close'))closeOriginal();
      else if(b.hasAttribute('data-play')) {
        if(s.interval!==null){stop();return;}if(s.time===60)move(0);
        play.textContent='Pause sample';s.interval=setInterval(()=>move(s.time+1),1000);
      } else if(b.hasAttribute('data-jump')){stop();move(Number(b.dataset.jump));}
      else if(b.hasAttribute('data-select')){s.selected=b.dataset.select;redraw(true);scene.querySelector('[data-select="'+s.selected+'"]')?.focus();}
      else if(b.hasAttribute('data-beat')){s.beat=Number(b.dataset.beat);redraw(true);scene.querySelector('[data-beat="'+s.beat+'"]')?.focus();}
      else if(b.hasAttribute('data-stack')){const l=b.dataset.stack;s.stack.has(l)?s.stack.delete(l):s.stack.add(l);redraw(true);scene.querySelector('[data-stack="'+l+'"]')?.focus();}
    });
    section.addEventListener('toggle',e=>{
      if(e.target.matches('details[data-moment]') && e.target.isConnected){
        const i=Number(e.target.dataset.moment);e.target.open?s.open.add(i):s.open.delete(i);
      }
    },true);
    section.addEventListener('keydown',e=>{if(e.key==='Escape'&&!original.hidden){e.preventDefault();closeOriginal();}});
    slider.addEventListener('input',()=>{stop();move(Number(slider.value));});
    new MutationObserver(()=>{if(section.hidden){stop();if(!original.hidden){original.hidden=true;setBackground(false);}}}).observe(section,{attributes:true,attributeFilter:['hidden']});
    redraw();
  }
  restorePicks(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',e=>restorePicks(e.detail?.globals?.widgetState));
})();
</script>
<script>
(() => {
  const variants=[...document.querySelectorAll('.viz-carousel > [data-variant]')];
  const picker=document.getElementById('study');
  for (const [i,variant] of variants.entries()) picker.add(new Option(variant.dataset.variant,String(i)));
  const slug = v => v.dataset.variant.toLowerCase().replaceAll(' ', '-');
  function linkedView() {
    const index = variants.findIndex(v => slug(v) === location.hash.slice(1));
    return index < 0 ? 0 : index;
  }
  function show(i, remember = true) {
    const index=(i+variants.length)%variants.length;
    variants.forEach((v,j)=>v.hidden=j!==index);
    picker.value=String(index);
    document.getElementById('count').textContent=(index+1)+' / '+variants.length;
    if (remember) {
      try { history.replaceState(null, '', '#' + slug(variants[index])); } catch {}
    }
  }
  picker.addEventListener('change',()=>show(Number(picker.value)));
  document.getElementById('prev').addEventListener('click',()=>show(Number(picker.value)-1));
  document.getElementById('next').addEventListener('click',()=>show(Number(picker.value)+1));
  window.addEventListener('hashchange',()=>show(linkedView(), false));
  show(linkedView(), false);
})();
</script>
</main></body>
