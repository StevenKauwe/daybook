[package]
name = "daybook-local"
version = "0.1.0"
edition = "2024"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }
url = "2"
base64 = "0.22"
libc = "0.2"
pollster = "1"
ring = "0.17"
speechworks-inference = { path = "vendor/speechworks-8d2690a/crates/inference" }
speechworks-vad = { path = "vendor/speechworks-8d2690a/crates/vad" }
[profile.dev]
debug = 0
[profile.release]
opt-level = 2
